name: README Link Check

on:
  schedule:
    # Every Wednesday at 9 AM UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check README links
        id: check
        run: node scripts/check-links.js
        continue-on-error: true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: broken-links-report.json

      - name: Open or update issue with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('broken-links-report.json', 'utf-8'));
            const MARKER = '<!-- link-check-report -->';
            const title = '🔗 Broken links in README.md';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,broken-links',
            });
            const existing = issues.find((i) => i.body?.includes(MARKER));

            if (report.broken.length === 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  body: `${MARKER}\nAll README links passed as of ${report.checkedAt}. Closing.`,
                });
              }
              console.log('No broken links found.');
              return;
            }

            const lines = report.broken.map(
              (l) => `- [ ] [${l.title}](${l.url}) — ${l.status ?? l.error}`,
            );
            const warningNote = report.warnings.length
              ? `\n\n<details><summary>${report.warnings.length} link(s) returned 403/429 (likely bot-blocking, not necessarily dead — verify manually)</summary>\n\n${report.warnings.map((l) => `- [${l.title}](${l.url}) — ${l.status}`).join('\n')}\n\n</details>`
              : '';
            const body = `${MARKER}\nLast checked: ${report.checkedAt}\n\n${report.broken.length} broken link(s) found in README.md:\n\n${lines.join('\n')}${warningNote}\n\nCheck each box after fixing or removing the entry.`;

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automated', 'broken-links'],
              });
            }
